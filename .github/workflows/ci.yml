name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/crm-foundation]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Check API and tests
        run: pnpm verify
      - name: Build frontend
        run: pnpm build
